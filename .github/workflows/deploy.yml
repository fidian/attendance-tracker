name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Let a queued deploy wait for the one in flight rather than cancelling it, so
# a finished run always matches the newest commit on master.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # `npm run build` type checks again; this is the bundle on its own.
      - name: Build
        run: npx vite build

      - uses: actions/upload-pages-artifact@v4
        # A pull request gets the checks but never the deploy.
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
